<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿里云加速</title>
    <!-- 静态资源 -->
    <link href="https://apps.bdimg.com/libs/bootstrap/3.3.4/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://apps.bdimg.com/libs/fontawesome/4.4.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            background: #eef2f7;
            background-image:
                radial-gradient(1200px 520px at 50% -10%, rgba(43, 125, 233, .12), transparent 60%),
                linear-gradient(160deg, #f6f9ff 0%, #eef2f7 55%, #f7f8fa 100%);
            background-attachment: fixed;
            color: #2c3a4b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .main {
            flex: 1;
            padding: 64px 15px 48px;
            text-align: center;
        }

        /* 顶部品牌区 */
        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #3d8bfd, #1e63c4);
            box-shadow: 0 8px 24px rgba(43, 125, 233, .28);
            color: #fff;
            font-size: 28px;
        }
        .brand-title {
            margin: 22px 0 6px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #1f2d3d;
        }
        .brand-subtitle {
            margin: 0;
            font-size: 14px;
            color: #8a94a6;
        }

        /* 登录卡片 */
        .login-box {
            max-width: 380px;
            margin: 34px auto 0;
            padding: 32px 30px 26px;
            background-color: #fff;
            border: 1px solid rgba(31, 45, 61, .06);
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(31, 45, 61, .09);
            text-align: left;
        }
        .login-box .login-title {
            margin: 0 0 24px;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            color: #1f2d3d;
        }
        .login-box .form-group {
            position: relative;
            margin-bottom: 18px;
        }
        .login-box .form-control {
            height: 44px;
            padding-left: 40px;
            border: 1px solid #e3e8ef;
            border-radius: 9px;
            background-color: #fbfcfe;
            box-shadow: none;
            font-size: 14px;
            transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
        }
        .login-box .form-control:hover {
            border-color: #cfd8e5;
        }
        .login-box .form-control:focus {
            border-color: #3d8bfd;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(61, 139, 253, .14);
        }
        .login-box .form-control::-webkit-input-placeholder {
            color: #b3bcc9;
        }
        .login-box .field-icon {
            position: absolute;
            left: 15px;
            top: 14px;
            z-index: 2;
            color: #b3bcc9;
            font-size: 14px;
            transition: color .2s ease;
        }
        .login-box .form-control:focus + .field-icon,
        .login-box .form-group.focus .field-icon {
            color: #3d8bfd;
        }
        .login-box .toggle-password {
            position: absolute;
            right: 6px;
            top: 6px;
            z-index: 3;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #b3bcc9;
            outline: none;
            transition: color .2s ease, background-color .2s ease;
        }
        .login-box .toggle-password:hover {
            color: #3d8bfd;
            background-color: #f2f6fc;
        }

        /* 辅助行 */
        .login-extra {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 2px 0 18px;
            font-size: 13px;
            color: #8a94a6;
        }
        .login-extra label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
            user-select: none;
        }
        .login-extra input[type="checkbox"] {
            margin: 0 5px 0 0;
            vertical-align: -1px;
        }
        .login-extra a {
            color: #3d8bfd;
            text-decoration: none;
        }
        .login-extra a:hover {
            text-decoration: underline;
        }

        /* 按钮 */
        .login-box .btn-login {
            height: 44px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(135deg, #4a93fd, #1e63c4);
            font-size: 15px;
            letter-spacing: 2px;
            box-shadow: 0 6px 18px rgba(43, 125, 233, .28);
            transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
        }
        .login-box .btn-login:hover,
        .login-box .btn-login:focus {
            color: #fff;
            opacity: .96;
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(43, 125, 233, .34);
        }
        .login-box .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(43, 125, 233, .26);
        }
        .login-box .btn-login[disabled] {
            opacity: .7;
            transform: none;
        }

        .login-box .login-tip {
            min-height: 20px;
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            color: #d9534f;
        }
        .login-box .login-links {
            margin: 18px 0 0;
            padding-top: 16px;
            border-top: 1px solid #f0f3f7;
            font-size: 13px;
            color: #8a94a6;
            text-align: center;
        }
        .login-box .login-links a {
            color: #3d8bfd;
            text-decoration: none;
        }
        .login-box .login-links a:hover {
            text-decoration: underline;
        }

        /* 页脚 */
        .footer {
            padding: 26px 0 30px;
            font-size: 13px;
            color: #8a94a6;
            text-align: center;
        }
        .footer p {
            margin: 0 0 6px;
        }
        .footer a {
            color: #8a94a6;
            text-decoration: none;
            transition: color .2s ease;
        }
        .footer a:hover {
            color: #3d8bfd;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .main {
                padding: 40px 15px 32px;
            }
            .brand-title {
                font-size: 24px;
            }
            .login-box {
                padding: 26px 20px 22px;
            }
        }
    </style>
</head>
<body>
    <!-- 主体内容 -->
    <div class="container main">
        <div class="brand-logo">
            <i class="fa fa-rocket"></i>
        </div>
        <h1 class="brand-title">阿里云加速</h1>
        <p class="brand-subtitle">欢迎回来，请登录您的账号</p>

        <!-- 登录框：邮箱 + 密码 -->
        <div class="login-box">
            <h2 class="login-title">账号登录</h2>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <input type="email" class="form-control" id="login-email" placeholder="请输入邮箱" autocomplete="username">
                    <i class="fa fa-envelope field-icon"></i>
                </div>
                <div class="form-group">
                    <input type="password" class="form-control" id="login-password" placeholder="请输入密码" autocomplete="current-password">
                    <i class="fa fa-lock field-icon"></i>
                    <button type="button" class="toggle-password" id="toggle-password" title="显示密码" aria-label="显示密码">
                        <i class="fa fa-eye"></i>
                    </button>
                </div>
                <div class="login-extra">
                    <label><input type="checkbox" id="remember"> 记住我</label>
                    <a href="#">忘记密码？</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-login" id="btn-login">登 录</button>
                <div class="login-tip" id="login-tip"></div>
            </form>
            <div class="login-links">
                还没有账号？<a href="#">立即注册</a>
            </div>
        </div>
    </div>

    <!-- 底部备案信息 -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 All 微薄利 版权所有.</p>
            <p>
                <a href="https://beian.miit.gov.cn/" target="_blank">鲁ICP备2025144109号-25</a>
                &nbsp;&nbsp;
                <a href="https://beian.mps.gov.cn/" target="_blank">鲁公网安备37130202373077号</a>
            </p>
        </div>
    </footer>

    <script src="https://apps.bdimg.com/libs/jquery/2.1.4/jquery.min.js"></script>
    <script src="https://apps.bdimg.com/libs/bootstrap/3.3.4/js/bootstrap.min.js"></script>
    <script>
        $(function () {
            var $form = $('#login-form');
            var $email = $('#login-email');
            var $password = $('#login-password');
            var $tip = $('#login-tip');
            var $btn = $('#btn-login');

            function showTip(msg) {
                $tip.text(msg);
            }

            // 输入框聚焦时图标高亮
            $email.add($password)
                .on('focus', function () {
                    $(this).closest('.form-group').addClass('focus');
                })
                .on('blur', function () {
                    $(this).closest('.form-group').removeClass('focus');
                })
                .on('input', function () {
                    showTip('');
                });

            // 密码显示 / 隐藏
            $('#toggle-password').on('click', function () {
                var $icon = $(this).find('i');
                var show = $password.attr('type') === 'password';
                $password.attr('type', show ? 'text' : 'password');
                $icon.toggleClass('fa-eye', !show).toggleClass('fa-eye-slash', show);
                this.title = show ? '隐藏密码' : '显示密码';
            });

            $form.on('submit', function (e) {
                e.preventDefault();
                var email = $.trim($email.val());
                var password = $password.val();

                if (!email) {
                    showTip('请输入邮箱');
                    $email.focus();
                    return;
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showTip('邮箱格式不正确');
                    $email.focus();
                    return;
                }
                if (!password) {
                    showTip('请输入密码');
                    $password.focus();
                    return;
                }
                if (password.length < 6) {
                    showTip('密码长度不能少于 6 位');
                    $password.focus();
                    return;
                }

                showTip('');
                $btn.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> 登录中...');

                // TODO: 在此调用后端登录接口
                setTimeout(function () {
                    $btn.prop('disabled', false).text('登 录');
                    alert('登录信息校验通过，邮箱：' + email);
                }, 800);
            });
        });
    </script>
</body>
</html>
